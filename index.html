<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فكرة — صندوق أفكارك</title>
<meta name="description" content="سجّل فكرتك بصوتك أو بالكتابة في ثانيتين، وجدولها في تقويمك. بدون حساب، وبياناتك لا تغادر جهازك.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D7A66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="فكرة">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #F5F7F6;
    --surface: #FFFFFF;
    --surface-2: #EBF0EE;
    --ink: #14211E;
    --muted: #5F716C;
    --line: #DBE3E0;
    --accent: #0D7A66;
    --accent-ink: #FFFFFF;
    --accent-soft: #E3F0EC;
    --sched: #9A6614;
    --sched-soft: #F6ECD9;
    --rec: #B23B2B;
    --shadow: 0 1px 2px rgba(20,33,30,.05), 0 10px 28px rgba(20,33,30,.07);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D1513; --surface: #16211E; --surface-2: #1E2B27;
      --ink: #E9F0ED; --muted: #8FA29D; --line: #24322E;
      --accent: #45C9AC; --accent-ink: #06221B; --accent-soft: #122E28;
      --sched: #E0B15F; --sched-soft: #2C2415;
      --rec: #E8705F;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D1513; --surface: #16211E; --surface-2: #1E2B27;
    --ink: #E9F0ED; --muted: #8FA29D; --line: #24322E;
    --accent: #45C9AC; --accent-ink: #06221B; --accent-soft: #122E28;
    --sched: #E0B15F; --sched-soft: #2C2415;
    --rec: #E8705F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans Arabic", "SF Arabic", "Geeza Pro", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.65;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

  .wrap {
    max-width: 620px;
    margin-inline: auto;
    padding-inline: 18px;
    padding-block: max(18px, env(safe-area-inset-top)) calc(48px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: baseline; gap: 9px; }
  h1 { margin: 0; font-size: 1.3rem; font-weight: 600; letter-spacing: -.01em; }
  .tag { font-size: .76rem; color: var(--muted); }
  .count { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .capture {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 14px;
    display: flex; flex-direction: column; gap: 12px;
  }
  textarea {
    width: 100%; min-height: 112px; resize: vertical;
    border: 0; background: transparent; color: var(--ink);
    font: inherit; line-height: 1.7; padding: 2px; outline: none;
  }
  textarea::placeholder { color: var(--muted); opacity: .85; }

  .row { display: flex; gap: 10px; }

  button, .btn {
    font: inherit; font-weight: 500;
    border-radius: 11px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--ink);
    cursor: pointer; padding: 12px 14px;
    transition: transform .08s ease, background .15s ease;
    text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
  }
  button:active, .btn:active { transform: scale(.985); }
  button:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[disabled] { opacity: .45; cursor: default; }

  #save { flex: 1; background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  #mic { min-width: 118px; gap: 8px; }
  #mic .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  #mic.on { border-color: var(--rec); color: var(--rec); }
  #mic.on .dot { background: var(--rec); animation: pulse 1.1s infinite ease-in-out; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  @media (prefers-reduced-motion: reduce) { #mic.on .dot { animation: none } button:active { transform: none } }

  .status { font-size: .79rem; color: var(--muted); min-height: 1.2em; margin: 0; }
  .status.err { color: var(--rec); }

  .filters { display: flex; gap: 7px; flex-wrap: wrap; }
  .chip {
    font-size: .82rem; padding: 6px 13px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--muted);
  }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  li {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 13px; padding: 13px;
    display: flex; flex-direction: column; gap: 9px;
  }
  li .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  li .foot { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  li .when { font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-inline-end: auto; }
  li button { padding: 6px 11px; font-size: .79rem; border-radius: 9px; }
  li.done { border-style: dashed; }
  li.done .text { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }

  .due {
    font-size: .74rem; font-weight: 600;
    color: var(--sched); background: var(--sched-soft);
    padding: 3px 9px; border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }

  .sched { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-top: 9px; border-top: 1px solid var(--line); }
  .sched input[type="datetime-local"] {
    font: inherit; font-size: .88rem; color: var(--ink);
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 10px; flex: 1; min-width: 190px;
  }
  .sched .ok { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }

  .empty { border: 1px dashed var(--line); border-radius: 13px; padding: 20px; color: var(--muted); font-size: .89rem; }

  .note {
    background: var(--accent-soft); border-radius: 13px; padding: 13px 15px;
    font-size: .85rem; display: flex; gap: 10px; align-items: flex-start;
  }
  .note button { background: transparent; border: 0; padding: 0 2px; color: var(--accent); font-weight: 600; font-size: .85rem; }
  .note p { margin: 0; }

  footer { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  footer p { margin: 0; font-size: .78rem; color: var(--muted); }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .tools button { font-size: .79rem; padding: 8px 12px; border-radius: 9px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1>فكرة</h1>
      <span class="tag">صندوق أفكارك</span>
    </div>
    <span class="count" id="count"></span>
  </header>

  <div class="note" id="install-note" hidden>
    <p><strong>ثبّتها على شاشتك.</strong> <span id="install-how"></span> تصير أيقونة تفتح مباشرة، وأفكارك تبقى محفوظة.
    <button type="button" id="install-dismiss">فهمت</button></p>
  </div>

  <section class="capture">
    <textarea id="box" placeholder="اكتب الفكرة… أو اضغط «تسجيل» وتكلّم" autocomplete="off" autocorrect="on" spellcheck="false"></textarea>
    <div class="row">
      <button id="mic" type="button" aria-pressed="false"><span class="dot"></span><span id="mic-label">تسجيل</span></button>
      <button id="save" type="button" disabled>حفظ</button>
    </div>
    <p class="status" id="status"></p>
  </section>

  <div class="filters" role="group" aria-label="تصفية">
    <button class="chip" type="button" data-filter="open" aria-pressed="true">مفتوحة</button>
    <button class="chip" type="button" data-filter="due" aria-pressed="false">مجدولة</button>
    <button class="chip" type="button" data-filter="done" aria-pressed="false">تمت</button>
    <button class="chip" type="button" data-filter="all" aria-pressed="false">الكل</button>
  </div>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden></div>

  <footer>
    <div class="tools">
      <button type="button" id="export">تصدير نسخة</button>
      <button type="button" id="import-btn">استيراد</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
    <p>أفكارك محفوظة في جهازك وحده. لا حساب، ولا خادم، ولا أحد يطّلع عليها — ولا نحن.</p>
  </footer>

</div>

<script>
(function () {
  'use strict';

  var KEY = 'fikra.v1';
  var items = [];
  var filter = 'open';

  var box = document.getElementById('box');
  var save = document.getElementById('save');
  var mic = document.getElementById('mic');
  var micLabel = document.getElementById('mic-label');
  var statusEl = document.getElementById('status');
  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');
  var countEl = document.getElementById('count');

  function say(msg, isErr) {
    statusEl.textContent = msg || '';
    statusEl.classList.toggle('err', !!isErr);
  }

  /* ---------- storage ---------- */

  function load() {
    try { items = JSON.parse(localStorage.getItem(KEY) || '[]'); }
    catch (e) { items = []; }
    if (!Array.isArray(items)) items = [];
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); return true; }
    catch (e) { say('ما قدرت أحفظ — مساحة التخزين ممتلئة أو محظورة', true); return false; }
  }
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(function () {});
  }

  /* ---------- helpers ---------- */

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function whenText(ts) {
    var d = new Date(ts);
    var mins = (Date.now() - ts) / 60000;
    if (mins < 1) return 'الآن';
    if (mins < 60) return 'قبل ' + Math.round(mins) + ' دقيقة';
    var time = pad(d.getHours()) + ':' + pad(d.getMinutes());
    if (d.toDateString() === new Date().toDateString()) return 'اليوم ' + time;
    var y = new Date(Date.now() - 86400000);
    if (d.toDateString() === y.toDateString()) return 'أمس ' + time;
    return d.toLocaleDateString('ar', { day: 'numeric', month: 'long' }) + ' · ' + time;
  }

  function dueText(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString('ar', { weekday: 'short', day: 'numeric', month: 'short' })
      + ' · ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function icsStamp(d) {
    return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T'
      + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
  }

  function icsEscape(s) {
    return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  }

  function downloadIcs(item, start) {
    var end = new Date(start.getTime() + 30 * 60000);
    var title = item.text.split('\n')[0].slice(0, 70);
    var lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//fikra//idea box//AR',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      'UID:' + item.id + '@fikra',
      'DTSTAMP:' + icsStamp(new Date()),
      'DTSTART:' + icsStamp(start),
      'DTEND:' + icsStamp(end),
      'SUMMARY:' + icsEscape(title),
      'DESCRIPTION:' + icsEscape(item.text),
      'BEGIN:VALARM',
      'TRIGGER:-PT15M',
      'ACTION:DISPLAY',
      'DESCRIPTION:' + icsEscape(title),
      'END:VALARM',
      'END:VEVENT',
      'END:VCALENDAR'
    ];
    var blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'fikra-' + item.id + '.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  /* ---------- rendering ---------- */

  function visible() {
    return items.filter(function (i) {
      if (filter === 'all') return true;
      if (filter === 'done') return i.status === 'done';
      if (filter === 'due') return i.status !== 'done' && !!i.due;
      return i.status !== 'done';
    });
  }

  function render() {
    items.sort(function (a, b) {
      if (!!a.due !== !!b.due && a.status !== 'done' && b.status !== 'done') return a.due ? -1 : 1;
      if (a.due && b.due) return new Date(a.due) - new Date(b.due);
      return b.createdAt - a.createdAt;
    });

    var open = items.filter(function (i) { return i.status !== 'done'; }).length;
    countEl.textContent = items.length ? open + ' مفتوحة' : '';

    var rows = visible();
    listEl.textContent = '';

    if (!rows.length) {
      emptyEl.hidden = false;
      emptyEl.textContent = items.length
        ? 'ما فيه أفكار في هذي القائمة.'
        : 'ما سجّلت فكرة بعد. اكتب أول فكرة فوق أو سجّلها بصوتك.';
      return;
    }
    emptyEl.hidden = true;

    rows.forEach(function (it) {
      var li = document.createElement('li');
      if (it.status === 'done') li.className = 'done';

      var t = document.createElement('div');
      t.className = 'text';
      t.textContent = it.text;
      li.appendChild(t);

      var foot = document.createElement('div');
      foot.className = 'foot';

      var when = document.createElement('span');
      when.className = 'when';
      when.textContent = whenText(it.createdAt);
      foot.appendChild(when);

      if (it.due) {
        var badge = document.createElement('span');
        badge.className = 'due';
        badge.textContent = dueText(it.due);
        foot.insertBefore(badge, when);
      }

      if (it.status !== 'done') {
        var sc = document.createElement('button');
        sc.type = 'button';
        sc.textContent = it.due ? 'تعديل الموعد' : 'جدولة';
        sc.addEventListener('click', function () { openSched(li, it, sc); });
        foot.appendChild(sc);
      }

      var dn = document.createElement('button');
      dn.type = 'button';
      dn.textContent = it.status === 'done' ? 'رجّع' : 'تمت';
      dn.addEventListener('click', function () {
        it.status = it.status === 'done' ? 'open' : 'done';
        persist(); render();
      });
      foot.appendChild(dn);

      var del = document.createElement('button');
      del.type = 'button';
      del.textContent = 'حذف';
      del.addEventListener('click', function () {
        items = items.filter(function (x) { return x.id !== it.id; });
        persist(); render();
      });
      foot.appendChild(del);

      li.appendChild(foot);
      listEl.appendChild(li);
    });
  }

  function openSched(li, it, btn) {
    var old = li.querySelector('.sched');
    if (old) { old.remove(); return; }

    var wrap = document.createElement('div');
    wrap.className = 'sched';

    var inp = document.createElement('input');
    inp.type = 'datetime-local';
    inp.id = 'due-' + it.id;
    var base = it.due ? new Date(it.due) : new Date(Date.now() + 3600000);
    base.setSeconds(0, 0);
    inp.value = base.getFullYear() + '-' + pad(base.getMonth() + 1) + '-' + pad(base.getDate())
      + 'T' + pad(base.getHours()) + ':' + pad(base.getMinutes());

    var ok = document.createElement('button');
    ok.type = 'button';
    ok.className = 'ok';
    ok.textContent = 'أضف للتقويم';
    ok.addEventListener('click', function () {
      if (!inp.value) { say('اختر تاريخاً ووقتاً', true); return; }
      var start = new Date(inp.value);
      if (isNaN(start.getTime())) { say('التاريخ غير صحيح', true); return; }
      it.due = start.toISOString();
      persist();
      downloadIcs(it, start);
      wrap.remove();
      render();
      say('نزّل ملف الموعد — افتحه ليُضاف لتقويمك');
    });

    var only = document.createElement('button');
    only.type = 'button';
    only.textContent = 'احفظ الموعد فقط';
    only.addEventListener('click', function () {
      if (!inp.value) return;
      var start = new Date(inp.value);
      if (isNaN(start.getTime())) return;
      it.due = start.toISOString();
      persist(); wrap.remove(); render();
      say('انحفظ الموعد داخل فكرة');
    });

    wrap.appendChild(inp); wrap.appendChild(ok); wrap.appendChild(only);

    if (it.due) {
      var clear = document.createElement('button');
      clear.type = 'button';
      clear.textContent = 'إلغاء الموعد';
      clear.addEventListener('click', function () {
        it.due = null; persist(); wrap.remove(); render();
      });
      wrap.appendChild(clear);
    }

    li.appendChild(wrap);
    inp.focus();
  }

  /* ---------- capture ---------- */

  function syncSave() { save.disabled = box.value.trim().length === 0; }
  box.addEventListener('input', syncSave);

  save.addEventListener('click', function () {
    var v = box.value.trim();
    if (!v) return;
    if (recognizing) stopRec();
    items.push({
      id: String(Date.now()) + Math.random().toString(36).slice(2, 6),
      text: v,
      createdAt: Date.now(),
      status: 'open',
      due: null
    });
    if (persist()) {
      box.value = '';
      syncSave();
      if (filter === 'done' || filter === 'due') setFilter('open');
      else render();
      say('انحفظت ✓');
      box.focus();
    }
  });

  box.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); save.click(); }
  });

  /* ---------- voice ---------- */

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, recognizing = false, base = '';

  if (!SR) {
    mic.hidden = true;
    box.placeholder = 'اكتب الفكرة… أو استخدم زر المايك في لوحة المفاتيح';
  } else {
    rec = new SR();
    rec.lang = 'ar-SA';
    rec.continuous = true;
    rec.interimResults = true;

    rec.onstart = function () {
      recognizing = true;
      mic.classList.add('on');
      mic.setAttribute('aria-pressed', 'true');
      micLabel.textContent = 'إيقاف';
      say('يسمعك… تكلّم');
    };
    rec.onresult = function (ev) {
      var interim = '', fin = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var txt = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) fin += txt + ' '; else interim += txt;
      }
      if (fin) base = (base + ' ' + fin).replace(/\s+/g, ' ').trim();
      box.value = (base + ' ' + interim).trim();
      syncSave();
    };
    rec.onerror = function (ev) {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        say('المايك ممنوع — اسمح بالميكروفون لهذا الموقع من إعدادات المتصفح', true);
      } else if (ev.error === 'no-speech') {
        say('ما سمعت شي');
      } else if (ev.error !== 'aborted') {
        say('تعذّر التسجيل — اكتب الفكرة بدل التسجيل', true);
      }
    };
    rec.onend = function () {
      recognizing = false;
      mic.classList.remove('on');
      mic.setAttribute('aria-pressed', 'false');
      micLabel.textContent = 'تسجيل';
      if (statusEl.textContent === 'يسمعك… تكلّم') say('');
    };

    mic.addEventListener('click', function () {
      if (recognizing) { stopRec(); return; }
      base = box.value.trim();
      try { rec.start(); } catch (e) { say('ما قدرت أبدأ التسجيل', true); }
    });
  }
  function stopRec() { try { rec && rec.stop(); } catch (e) {} }

  /* ---------- filters ---------- */

  function setFilter(f) {
    filter = f;
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) {
      c.setAttribute('aria-pressed', c.dataset.filter === f ? 'true' : 'false');
    });
    render();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) {
    c.addEventListener('click', function () { setFilter(c.dataset.filter); });
  });

  /* ---------- export / import ---------- */

  document.getElementById('export').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    var d = new Date();
    a.download = 'fikra-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    say('نزّلت نسخة من أفكارك');
  });

  var importFile = document.getElementById('import-file');
  document.getElementById('import-btn').addEventListener('click', function () { importFile.click(); });
  importFile.addEventListener('change', function () {
    var f = importFile.files && importFile.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var incoming = JSON.parse(r.result);
        if (!Array.isArray(incoming)) throw new Error('shape');
        var known = {};
        items.forEach(function (i) { known[i.id] = 1; });
        var added = 0;
        incoming.forEach(function (i) {
          if (i && i.id && i.text && !known[i.id]) {
            items.push({
              id: i.id, text: String(i.text),
              createdAt: i.createdAt || Date.now(),
              status: i.status === 'done' ? 'done' : 'open',
              due: i.due || null
            });
            added++;
          }
        });
        persist(); render();
        say(added ? 'أضفت ' + added + ' فكرة' : 'ما فيه أفكار جديدة في الملف');
      } catch (e) {
        say('الملف غير صالح', true);
      }
      importFile.value = '';
    };
    r.readAsText(f);
  });

  /* ---------- install hint ---------- */

  (function () {
    var note = document.getElementById('install-note');
    var how = document.getElementById('install-how');
    var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    var dismissed = false;
    try { dismissed = localStorage.getItem('fikra.installhint') === '1'; } catch (e) {}
    if (standalone || dismissed) return;

    var ua = navigator.userAgent;
    var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    how.textContent = isIOS
      ? 'من زر المشاركة اختر «إضافة إلى الشاشة الرئيسية».'
      : 'من قائمة المتصفح اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».';
    note.hidden = false;

    document.getElementById('install-dismiss').addEventListener('click', function () {
      note.hidden = true;
      try { localStorage.setItem('fikra.installhint', '1'); } catch (e) {}
    });
  })();

  /* ---------- boot ---------- */

  load();
  setFilter('open');
  syncSave();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
